# Torn Raffles API. Runs on the NAS, listening only on localhost; DSM's reverse
# proxy publishes it at https://raffles.xerramc.synology.me:5443
services:
  torn-raffles:
    image: python:3.12-slim
    working_dir: /app
    network_mode: host
    container_name: torn-raffles
    restart: unless-stopped
    volumes:
      - ./:/app
      - ./data:/data          # raffles.db persists here (survives rebuilds)
    environment:
      RAFFLES_ADMIN_ID: "2775419"
      RAFFLES_ALLOWED_ORIGIN: "https://lordxerra.github.io"
      RAFFLES_DATA_DIR: "/data"
    command: ["sh", "-c", "pip install --no-index --find-links=/app/wheels flask gunicorn && exec gunicorn --workers 1 --threads 4 -b 127.0.0.1:5210 --access-logfile - --error-logfile - app:app"]
